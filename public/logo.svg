<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sepia">
  <defs>
    <linearGradient id="s-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#382A28"/>
      <stop offset="100%" stop-color="#211B1A"/>
    </linearGradient>
    <linearGradient id="s-tile-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60433D"/>
      <stop offset="100%" stop-color="#916B60"/>
    </linearGradient>
    <linearGradient id="s-tile-lift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C1A094"/>
      <stop offset="100%" stop-color="#E8D8CE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#s-badge)"/>

  <rect x="120" y="272" width="220" height="120" rx="36"
        fill="url(#s-tile-front)" opacity="0.45"/>
  <rect x="136" y="248" width="220" height="120" rx="36"
        fill="url(#s-tile-front)"/>

  <g transform="rotate(12 300 180)">
    <rect x="220" y="108" width="132" height="132" rx="38"
          fill="url(#s-tile-lift)"/>
    <circle cx="252" cy="140" r="9" fill="#211B1A" opacity="0.55"/>
    <rect x="242" y="170" width="92" height="12" rx="6" fill="#211B1A" opacity="0.38"/>
    <rect x="242" y="194" width="60" height="12" rx="6" fill="#211B1A" opacity="0.28"/>
  </g>
</svg>