[package]
name = "sepia"
version = "0.1.0"
description = "Sepia — Your software, curated."
authors = ["Arafat Khan"]
edition = "2021"

[lib]
name = "sepia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
walkdir = "2.5" # ADD THIS
tauri-plugin-opener = "2.7.2"
